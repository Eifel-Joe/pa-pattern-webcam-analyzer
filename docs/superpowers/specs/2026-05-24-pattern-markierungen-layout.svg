<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1200 760" font-family="Helvetica, Arial, sans-serif">
  <!-- Hintergrund: Druckbett (helles Beige) -->
  <rect width="1200" height="760" fill="#e6d8b8"/>

  <!-- Titel -->
  <text x="600" y="34" text-anchor="middle" font-size="22" font-weight="bold" fill="#222">PA-Pattern-Layout — Markierungen (Approach A)</text>
  <text x="600" y="56" text-anchor="middle" font-size="13" fill="#555">Schematisch · 17 Chevrons · PA 0.000–0.080 · Schritt 0.005 · 3 verschachtelte Wände pro Chevron</text>

  <!-- =================== PATTERN =================== -->
  <g transform="translate(150, 110)">

    <!-- Frame (4-seitige Outline) -->
    <rect x="0" y="0" width="900" height="500" fill="none" stroke="#b22" stroke-width="3"/>

    <!-- Solid-Top-Bar: Vollfüllung der oberen ~30 % -->
    <rect x="0" y="0" width="900" height="150" fill="#c33"/>

    <!-- PA-Labels auf dem Top-Bar, hochkant (90° rotiert, Lesrichtung oben → unten) -->
    <g font-size="14" font-weight="bold" fill="#fff" text-anchor="middle" font-family="Consolas, monospace">
      <text x="35"  y="75" transform="rotate(90, 35, 75)">0.000</text>
      <text x="85"  y="75" transform="rotate(90, 85, 75)">0.005</text>
      <text x="135" y="75" transform="rotate(90, 135, 75)">0.010</text>
      <text x="185" y="75" transform="rotate(90, 185, 75)">0.015</text>
      <text x="235" y="75" transform="rotate(90, 235, 75)">0.020</text>
      <text x="285" y="75" transform="rotate(90, 285, 75)">0.025</text>
      <text x="335" y="75" transform="rotate(90, 335, 75)">0.030</text>
      <text x="385" y="75" transform="rotate(90, 385, 75)">0.035</text>
      <text x="435" y="75" transform="rotate(90, 435, 75)">0.040</text>
      <text x="485" y="75" transform="rotate(90, 485, 75)">0.045</text>
      <text x="535" y="75" transform="rotate(90, 535, 75)">0.050</text>
      <text x="585" y="75" transform="rotate(90, 585, 75)">0.055</text>
      <text x="635" y="75" transform="rotate(90, 635, 75)">0.060</text>
      <text x="685" y="75" transform="rotate(90, 685, 75)">0.065</text>
      <text x="735" y="75" transform="rotate(90, 735, 75)">0.070</text>
      <text x="785" y="75" transform="rotate(90, 785, 75)">0.075</text>
      <text x="835" y="75" transform="rotate(90, 835, 75)">0.080</text>
    </g>

    <!-- Anker-Marker (kleines Rechteck angedockt an Frame-Linkskante) -->
    <rect x="5" y="295" width="22" height="80" fill="#c33"/>

    <!-- Chevrons: 17 Stück, jeweils mit 3 verschachtelten Wänden (Ellis-Stil) -->
    <g stroke="#c33" stroke-width="1.6" fill="none" stroke-linecap="round" stroke-linejoin="round">
      <!-- Chevron-Gruppe i: starting bei sx = 38 + i*50, Y-Bereich 195..475, Apex bei (sx+30, 335) -->
      <!-- Gruppe 0 (PA 0.000) -->
      <path d="M 38,195 L 68,335 L 38,475"/>
      <path d="M 43,195 L 73,335 L 43,475"/>
      <path d="M 48,195 L 78,335 L 48,475"/>
      <!-- 1 (0.005) -->
      <path d="M 88,195 L 118,335 L 88,475"/>
      <path d="M 93,195 L 123,335 L 93,475"/>
      <path d="M 98,195 L 128,335 L 98,475"/>
      <!-- 2 (0.010) -->
      <path d="M 138,195 L 168,335 L 138,475"/>
      <path d="M 143,195 L 173,335 L 143,475"/>
      <path d="M 148,195 L 178,335 L 148,475"/>
      <!-- 3 (0.015) -->
      <path d="M 188,195 L 218,335 L 188,475"/>
      <path d="M 193,195 L 223,335 L 193,475"/>
      <path d="M 198,195 L 228,335 L 198,475"/>
      <!-- 4 (0.020) -->
      <path d="M 238,195 L 268,335 L 238,475"/>
      <path d="M 243,195 L 273,335 L 243,475"/>
      <path d="M 248,195 L 278,335 L 248,475"/>
      <!-- 5 (0.025) -->
      <path d="M 288,195 L 318,335 L 288,475"/>
      <path d="M 293,195 L 323,335 L 293,475"/>
      <path d="M 298,195 L 328,335 L 298,475"/>
      <!-- 6 (0.030) -->
      <path d="M 338,195 L 368,335 L 338,475"/>
      <path d="M 343,195 L 373,335 L 343,475"/>
      <path d="M 348,195 L 378,335 L 348,475"/>
      <!-- 7 (0.035) -->
      <path d="M 388,195 L 418,335 L 388,475"/>
      <path d="M 393,195 L 423,335 L 393,475"/>
      <path d="M 398,195 L 428,335 L 398,475"/>
      <!-- 8 (0.040) -->
      <path d="M 438,195 L 468,335 L 438,475"/>
      <path d="M 443,195 L 473,335 L 443,475"/>
      <path d="M 448,195 L 478,335 L 448,475"/>
      <!-- 9 (0.045) -->
      <path d="M 488,195 L 518,335 L 488,475"/>
      <path d="M 493,195 L 523,335 L 493,475"/>
      <path d="M 498,195 L 528,335 L 498,475"/>
      <!-- 10 (0.050) -->
      <path d="M 538,195 L 568,335 L 538,475"/>
      <path d="M 543,195 L 573,335 L 543,475"/>
      <path d="M 548,195 L 578,335 L 548,475"/>
      <!-- 11 (0.055) -->
      <path d="M 588,195 L 618,335 L 588,475"/>
      <path d="M 593,195 L 623,335 L 593,475"/>
      <path d="M 598,195 L 628,335 L 598,475"/>
      <!-- 12 (0.060) -->
      <path d="M 638,195 L 668,335 L 638,475"/>
      <path d="M 643,195 L 673,335 L 643,475"/>
      <path d="M 648,195 L 678,335 L 648,475"/>
      <!-- 13 (0.065) -->
      <path d="M 688,195 L 718,335 L 688,475"/>
      <path d="M 693,195 L 723,335 L 693,475"/>
      <path d="M 698,195 L 728,335 L 698,475"/>
      <!-- 14 (0.070) -->
      <path d="M 738,195 L 768,335 L 738,475"/>
      <path d="M 743,195 L 773,335 L 743,475"/>
      <path d="M 748,195 L 778,335 L 748,475"/>
      <!-- 15 (0.075) -->
      <path d="M 788,195 L 818,335 L 788,475"/>
      <path d="M 793,195 L 823,335 L 793,475"/>
      <path d="M 798,195 L 828,335 L 798,475"/>
      <!-- 16 (0.080) -->
      <path d="M 838,195 L 868,335 L 838,475"/>
      <path d="M 843,195 L 873,335 L 843,475"/>
      <path d="M 848,195 L 878,335 L 848,475"/>
    </g>
  </g>

  <!-- =================== ANNOTATIONEN =================== -->
  <g font-size="13" fill="#222">

    <!-- "Frame" -->
    <line x1="80" y1="110" x2="148" y2="110" stroke="#222" stroke-width="1"/>
    <circle cx="148" cy="110" r="3" fill="#222"/>
    <text x="75" y="114" text-anchor="end" font-weight="bold">Frame (4-seitig)</text>
    <text x="75" y="130" text-anchor="end" fill="#555" font-size="11">durchgehende Outline</text>

    <!-- "Solid-Top-Bar" -->
    <line x1="80" y1="170" x2="148" y2="170" stroke="#222" stroke-width="1"/>
    <circle cx="148" cy="170" r="3" fill="#222"/>
    <text x="75" y="174" text-anchor="end" font-weight="bold">Solid-Top-Bar</text>
    <text x="75" y="190" text-anchor="end" fill="#555" font-size="11">Vollfüllung · ~30 % der Höhe</text>
    <text x="75" y="204" text-anchor="end" fill="#555" font-size="11">in allen Layern → CV-Anker</text>

    <!-- "PA-Labels hochkant" -->
    <line x1="80" y1="240" x2="148" y2="240" stroke="#222" stroke-width="1"/>
    <line x1="148" y1="240" x2="185" y2="190" stroke="#222" stroke-width="1"/>
    <circle cx="185" cy="190" r="3" fill="#222"/>
    <text x="75" y="244" text-anchor="end" font-weight="bold">PA-Labels (hochkant)</text>
    <text x="75" y="260" text-anchor="end" fill="#555" font-size="11">90° rotiert · auf Top-Bar</text>
    <text x="75" y="274" text-anchor="end" fill="#555" font-size="11">in oberster Layer als Relief</text>

    <!-- "Anker-Marker" -->
    <line x1="80" y1="430" x2="148" y2="430" stroke="#222" stroke-width="1"/>
    <line x1="148" y1="430" x2="170" y2="420" stroke="#222" stroke-width="1"/>
    <circle cx="170" cy="420" r="3" fill="#222"/>
    <text x="75" y="434" text-anchor="end" font-weight="bold">Anker-Marker</text>
    <text x="75" y="450" text-anchor="end" fill="#555" font-size="11">eindeutige Links-Erkennung</text>
    <text x="75" y="464" text-anchor="end" fill="#555" font-size="11">2 × 8 mm, an Frame-Links</text>

    <!-- "Chevrons" - rechts -->
    <line x1="1075" y1="450" x2="930" y2="450" stroke="#222" stroke-width="1"/>
    <circle cx="930" cy="450" r="3" fill="#222"/>
    <text x="1080" y="454" font-weight="bold">Chevrons</text>
    <text x="1080" y="470" fill="#555" font-size="11">17 Gruppen · 3 Wände</text>
    <text x="1080" y="484" fill="#555" font-size="11">je PA-Wert eine Gruppe</text>

    <!-- "PA-Werte" - rechts oben -->
    <line x1="1075" y1="170" x2="990" y2="170" stroke="#222" stroke-width="1"/>
    <circle cx="990" cy="170" r="3" fill="#222"/>
    <text x="1080" y="174" font-weight="bold">PA-Wert pro Chevron</text>
    <text x="1080" y="190" fill="#555" font-size="11">"0.000" bis "0.080"</text>
    <text x="1080" y="204" fill="#555" font-size="11">Schritt 0.005 → 17 Werte</text>
  </g>

  <!-- =================== MASS-LEGENDE UNTEN =================== -->
  <g transform="translate(150, 650)" font-size="12" fill="#333">
    <text x="0" y="0" font-weight="bold" fill="#222">Standard-Maße (konfigurierbar via GeneratorParams):</text>
    <text x="0" y="20">• <tspan font-family="Consolas, monospace" fill="#444">top_bar_height</tspan> = 4 mm · Vollfüllung über volle Pattern-Breite</text>
    <text x="0" y="38">• <tspan font-family="Consolas, monospace" fill="#444">label_glyph_height</tspan> = 0.7 mm · 5 Glyphen vertikal gestapelt ≈ 3.5 mm</text>
    <text x="0" y="56">• <tspan font-family="Consolas, monospace" fill="#444">anchor_marker_size</tspan> = 2 mm · gefülltes Rechteck</text>
    <text x="450" y="20">• Labels werden nur in Layer <tspan font-family="Consolas, monospace" fill="#444">num_layers</tspan> gedruckt (oberste)</text>
    <text x="450" y="38">• Top-Bar in allen Layern (CV-Stabilität bei Webcam-Auflösung)</text>
    <text x="450" y="56">• Chevrons: bestehende Geometrie unverändert (3 Wände, Apex rechts)</text>
  </g>

  <!-- Footer -->
  <text x="600" y="745" text-anchor="middle" font-size="11" fill="#888">docs/superpowers/specs/2026-05-24-pattern-markierungen-layout.svg</text>
</svg>
