# PA-Analyzer — Klipper-Anbindung
# =====================================================================
# In die printer.cfg aufnehmen:   [include pa_calibrate.cfg]
#
# Voraussetzungen:
#   - gcode_shell_command (Klipper-Erweiterung) ist installiert
#   - PA-Analyzer ist per install.sh eingerichtet
#
# ANPASSEN: Die zwei command:-Pfade unten gehen vom Standard-
# Installationsort /home/pi/pa-pattern-webcam-analyzer (Repo) und
# /home/pi/printer_data/config (Klipper) aus — so legt install.sh das
# Projekt ab und kopiert die Konfiguration. Wer woanders installiert,
# passt die Pfade an. pa_analyzer.conf muss webcam_url, gcode_path
# (= der von SDCARD_PRINT_FILE genutzte Pfad) und vor allem die nicht-
# genormten PRINT_START/PRINT_END-Aufrufe enthalten — siehe
# pa_analyzer.example.conf als Vorlage.
# =====================================================================

[gcode_shell_command pa_generate]
command: /home/pi/pa-pattern-webcam-analyzer/.venv/bin/pa-analyzer --config /home/pi/printer_data/config/pa_analyzer.conf generate
timeout: 60.0
verbose: True

[gcode_shell_command pa_analyze]
command: /home/pi/pa-pattern-webcam-analyzer/.venv/bin/pa-analyzer --config /home/pi/printer_data/config/pa_analyzer.conf run
timeout: 120.0
verbose: True

[gcode_macro PA_CALIBRATE]
description: Druckt ein PA-Kalibrierungspattern und wertet es per Webcam aus
# Alle Parameter sind optional. NICHT gesetzte Parameter werden NICHT als
# CLI-Argument weitergegeben — die Generator-Code-Defaults wirken dann
# (siehe GeneratorParams in src/pa_analyzer/gcode_generator.py). So bleiben
# Macro und Code synchron, ohne dass beide an zwei Stellen geändert werden
# müssen. Ehemals fest verdrahtete Defaults (pa_end=0.08, pa_step=0.005,
# temp=240, ...) führten zu Pattern-Drift wenn Code-Defaults geändert
# wurden — Bug Live-Test 6: pa_end=0.08 erzeugte 333-mm-Pattern, das
# auf dem 301-mm-Bett nicht passte und Klipper-idle-timeout-Cancel.
gcode:
    {% set args = [] %}
    {% if params.PA_START is defined %}{% set _ = args.append("--pa-start " ~ params.PA_START) %}{% endif %}
    {% if params.PA_END   is defined %}{% set _ = args.append("--pa-end "   ~ params.PA_END)   %}{% endif %}
    {% if params.PA_STEP  is defined %}{% set _ = args.append("--pa-step "  ~ params.PA_STEP)  %}{% endif %}
    {% if params.TEMP     is defined %}{% set _ = args.append("--temp "     ~ params.TEMP)     %}{% endif %}
    {% if params.BED_TEMP is defined %}{% set _ = args.append("--bed-temp " ~ params.BED_TEMP) %}{% endif %}
    {% if params.FLOW     is defined %}{% set _ = args.append("--flow "     ~ params.FLOW)     %}{% endif %}
    {% if params.FAN      is defined %}{% set _ = args.append("--fan "      ~ params.FAN)      %}{% endif %}
    {% if params.SPEED    is defined %}{% set _ = args.append("--speed "    ~ params.SPEED)    %}{% endif %}
    {% if params.ACCEL    is defined %}{% set _ = args.append("--accel "    ~ params.ACCEL)    %}{% endif %}
    {% if params.WALLS    is defined %}{% set _ = args.append("--walls "    ~ params.WALLS)    %}{% endif %}
    {% set joined_args = args|join(' ') %}
    RUN_SHELL_COMMAND CMD=pa_generate PARAMS="{joined_args}"
    # FILENAME muss zum Basename von gcode_path in pa_analyzer.conf passen.
    SDCARD_PRINT_FILE FILENAME=pa_calibration.gcode
