# PA-Analyzer — Klipper-Anbindung
# =====================================================================
# In die printer.cfg aufnehmen:   [include pa_calibrate.cfg]
#
# Voraussetzungen:
#   - gcode_shell_command (Klipper-Erweiterung) ist installiert
#   - PA-Analyzer ist per install.sh eingerichtet
#
# ANPASSEN: Die drei command:-Pfade unten gehen vom Standard-
# Installationsort /home/pi/pa-pattern-webcam-analyzer aus (so legt
# install.sh das Projekt ab). Wer woanders installiert, passt die Pfade
# an. pa_analyzer.json muss webcam_url, gcode_path (= der von
# SDCARD_PRINT_FILE genutzte Pfad) und vor allem die nicht-genormten
# PRINT_START/PRINT_END-Aufrufe enthalten — siehe pa_analyzer.example.conf
# als Vorlage.
# =====================================================================

[gcode_shell_command pa_generate]
command: /home/pi/pa-pattern-webcam-analyzer/.venv/bin/pa-analyzer --config /home/pi/pa-pattern-webcam-analyzer/pa_analyzer.conf generate
timeout: 60.0
verbose: True

[gcode_shell_command pa_analyze]
command: /home/pi/pa-pattern-webcam-analyzer/.venv/bin/pa-analyzer --config /home/pi/pa-pattern-webcam-analyzer/pa_analyzer.conf run
timeout: 120.0
verbose: True

[gcode_macro PA_CALIBRATE]
description: Druckt ein PA-Kalibrierungspattern und wertet es per Webcam aus
gcode:
    {% set pa_start = params.PA_START|default(0.0)|float %}
    {% set pa_end   = params.PA_END|default(0.08)|float %}
    {% set pa_step  = params.PA_STEP|default(0.005)|float %}
    {% set temp     = params.TEMP|default(240.0)|float %}
    {% set bed_temp = params.BED_TEMP|default(60.0)|float %}
    {% set flow     = params.FLOW|default(1.0)|float %}
    {% set fan      = params.FAN|default(1.0)|float %}
    RUN_SHELL_COMMAND CMD=pa_generate PARAMS="--pa-start {pa_start} --pa-end {pa_end} --pa-step {pa_step} --temp {temp} --bed-temp {bed_temp} --flow {flow} --fan {fan}"
    # FILENAME muss zum Basename von gcode_path in pa_analyzer.json passen.
    SDCARD_PRINT_FILE FILENAME=pa_calibration.gcode
