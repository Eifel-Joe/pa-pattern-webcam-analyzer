# pa_analyzer.example.conf
# =============================================================================
# Vorlage. Nach `pa_analyzer.conf` kopieren und an die eigene Klipper-
# Installation anpassen — `pa_analyzer.conf` selbst ist gitignored.
#
# Diese Datei ist eine Einstellungsvoraussetzung: das Tool braucht deine
# PRINT_START/PRINT_END-Macro-Aufrufe, weil diese in jeder Klipper-
# Installation anders parametriert sind. Der Generator baut den
# vollständigen Druck-GCode um genau diese Aufrufe herum.
# =============================================================================

[webcam]
# Snapshot-URL der Drucker-Webcam (mjpg-streamer-Endpoint o.ä.).
url = http://DRUCKER-IP/webcam/?action=snapshot

[paths]
# Pfade auf dem Pi. gcode_path muss zum Verzeichnis zeigen, das Klipper
# für SDCARD_PRINT_FILE liest (typischerweise printer_data/gcodes).
gcode_path = /home/pi/printer_data/gcodes/pa_calibration.gcode
report_path = /home/pi/printer_data/pa_report.json

[macros]
# DEIN PRINT_START-Aufruf. Multi-line möglich — Folgezeilen einrücken.
# Die Platzhalter {temp} und {bed_temp} werden vom Generator mit den
# Werten ersetzt, die PA_CALIBRATE per TEMP=/BED_TEMP= übergibt.
# Andere {…}-Platzhalter bleiben unangetastet.
#
# Häufige PRINT_START-Signaturen — eine davon (ggf. angepasst) übernehmen:
#   PRINT_START EXTRUDER={temp} BED={bed_temp}              (Klipper-Standard)
#   PRINT_START HOTEND={temp} BED_TEMP={bed_temp}           (Klippain)
#   PRINT_START EXTRUDER={temp} BED={bed_temp} MATERIAL=PLA (mit Material-Hinweis)
#   PRINT_START T={temp} B={bed_temp}                       (Kurzform)
#
# WICHTIG: Wenn dein PRINT_START WEITERE Parameter erwartet (MATERIAL,
# PRINT_AREA_START/END, SOAKTIME, ADAPTIVE_MARGIN, ...), trage sie hier
# direkt mit konkreten Werten ein. Das Tool reicht nur die für die
# PA-Kalibrierung relevanten Werte (Hotend-Temp, Bett-Temp, Extrusions-
# faktor, Lüfter) durch — alles Drucker-spezifische gehört in diese
# Konfiguration.
#
# Beispiel mit drucker-spezifischen Zusatzparametern:
#   start_gcode =
#       PRINT_START EXTRUDER_TEMP={temp} BED_TEMP={bed_temp} MATERIAL=0 PRINT_AREA_START=25,25 PRINT_AREA_END=275,275
start_gcode =
    PRINT_START EXTRUDER={temp} BED={bed_temp}

# Dein PRINT_END-Aufruf (parkt den Druckkopf aus dem Webcam-Bild,
# schaltet Heizungen ab, etc.).
end_gcode =
    PRINT_END

# Optional: muss zum gcode_shell_command-Namen in pa_calibrate.cfg
# passen. Default RUN_SHELL_COMMAND CMD=pa_analyze — nur überschreiben,
# wenn du den Befehl in deiner printer.cfg umbenannt hast.
# analyze_gcode = RUN_SHELL_COMMAND CMD=pa_analyze

# True setzen, wenn dein PRINT_START-Macro bereits eine Purge-Linie
# zieht (z.B. ADAPTIVE_PURGE in KAMP-/Kiauh-Setups). Dann unterdrückt
# der Generator seine eigene Purge — sonst wird zweimal gepurgt
# (kein Crash, nur Material-Verschwendung).
# Default false: das Tool emittiert seine eigene Purge-Linie am
# linken Bett-Rand (sicher für PRINT_STARTs ohne integrierte Purge).
purge_in_start_macro = false

# True setzen, wenn dein PRINT_END-Macro Hotend, Bett und Lüfter
# selbst abschaltet (das tun die meisten — typische Befehle:
# M104 S0 / M140 S0 / M106 S0 oder M107). Dann lässt der Generator
# seinen Cooldown-Block weg.
# Default false: das Tool emittiert M104 S0 / M140 S0 / M107 vor
# PRINT_END als Sicherheitsnetz (in Klipper idempotent — bei doppeltem
# Aufruf harmlos).
cooldown_in_end_macro = false


# =============================================================================
# Optional: Generator-Test-Parameter überschreiben
# =============================================================================
# Defaults aus dem Code: speed_print = 100 mm/s, accel = 2000 mm/s²
# (konservativ, funktioniert auf der breiten Hobby-Drucker-Basis).
#
# Werden überschrieben durch SPEED=/ACCEL= im PA_CALIBRATE-Aufruf
# bzw. --speed/--accel auf der Kommandozeile. Override-Hierarchie:
#   CLI  >  Macro-Parameter  >  diese .conf  >  Code-Default
#
# Wer mit Input-Shaping schneller druckt (z.B. 180 mm/s @ 3000 mm/s²),
# trägt hier seine Standard-Test-Werte ein — dann reicht
# PA_CALIBRATE (ohne SPEED=/ACCEL=) im Klipper-Terminal.
#
# Beispiel-Override für einen schnelleren Drucker:
# [generator]
# speed_print = 180
# accel = 3000
